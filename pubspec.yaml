name: scan_to_know
description: "ScanToKnow – UI + OCR + Barcode integrated app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2
  flutter: 3.35.7

dependencies:
  flutter:
    sdk: flutter

  # ---------------- Core UI ----------------
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # ---------------- Navigation & UX ----------------
  curved_navigation_bar: ^1.0.6
  tutorial_coach_mark: ^1.2.3

  # ---------------- Local Storage ----------------
  shared_preferences: ^2.1.1

  # ---------------- Networking ----------------
  http: ^1.1.0

  # ---------------- Images ----------------
  cached_network_image: ^3.2.3
  image: ^4.1.3

  # ---------------- Camera & Scanning ----------------
  camera: ^0.11.0+2

  # ---------------- Google ML Kit ----------------
  google_mlkit_barcode_scanning: ^0.10.0
  google_mlkit_commons: ^0.6.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true

  assets:
    # ───────── Home / Top Categories ─────────
    - images/home_page_images/

    # ───────── Subcategories (Drinks) ─────────
    - images/categories/drinks/

    # ───────── Intro / Onboarding ─────────
    - images/intro_page_images/

    # ───────── Product Packet Images ─────────
    - images/packet_images/